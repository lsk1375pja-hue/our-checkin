<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Goals</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f2;color:#242424;font-family:Arial,sans-serif}
main{max-width:620px;margin:35px auto;padding:22px}
.card{background:white;border:1px solid #e6e6e0;border-radius:16px;padding:20px;margin:14px 0}
h1{font-size:25px}h2{font-size:18px}
input,button{font:inherit;padding:12px;border-radius:9px}
input{width:100%;border:1px solid #ddd;margin:6px 0 12px}
button{border:0;background:#242424;color:white;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0}
.goal{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.goal span{flex:1;overflow-wrap:anywhere}
.goal input{width:19px;margin:0}
.muted{color:#777;font-size:13px}
.error{color:#b42318;white-space:pre-wrap}
.good{color:#147a45}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>Daily Goals</h1>
  <p class="muted">오늘의 목표를 정하고, 서로 꾸준함을 확인하는 공간</p>

  <section id="login" class="card">
    <h2>로그인</h2>
    <label for="username">아이디</label>
    <input id="username" autocomplete="username" placeholder="아이디">
    <label for="password">비밀번호</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호">
    <button id="loginBtn" style="width:100%">로그인</button>
    <p id="loginError" class="error"></p>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div>
          <strong id="welcome"></strong>
          <p id="today" class="muted"></p>
        </div>
        <button id="logoutBtn">로그아웃</button>
      </div>
      <p id="deadline"></p>
      <p class="muted">오전 9시 전에 오늘의 목표를 등록해. 9시 이후에는 완료 체크만 가능해.</p>
    </div>

    <div class="card">
      <h2>오늘의 목표 추가</h2>
      <form id="goalForm" class="row">
        <input id="goalTitle" maxlength="200" placeholder="예: 수학 문제 30개 풀기" required>
        <button id="addBtn" type="submit">추가</button>
      </form>
      <p id="goalError" class="error"></p>
    </div>

    <div class="card">
      <h2>내 목표</h2>
      <p id="progress">달성률 계산 중...</p>
      <div style="height:8px;background:#eee;border-radius:8px;overflow:hidden">
        <div id="bar" style="height:100%;width:0%;background:#333"></div>
      </div>
      <div id="goals"></div>
      <p id="penalty"></p>
      <hr>
<h2>친구의 목표</h2>
<p id="friendProgress">달성률 계산 중...</p>
<div style="height:8px;background:#eee;border-radius:8px;overflow:hidden">
  <div id="friendBar" style="height:100%;width:0%;background:#777"></div>
</div>
<div id="friendGoals"></div>
<p id="friendPenalty"></p>
    </div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://unzewgikqvholarrkvrs.supabase.co";
const SUPABASE_KEY = "sb_publishable_sMuHTvi561u-owMTYDsSOw_7LP1Qo__";

const LOGIN_USERS = {
  "user1": { email: "lsk1375pja@gmail.com", name: "나" },
  "user2": { email: "swsylove@gmail.com", name: "친구" }
};

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;
let goals = [];

const $ = id => document.getElementById(id);
const koreaNow = () => new Date(
  new Date().toLocaleString("en-US", {timeZone:"Asia/Seoul"})
);
const dateKey = () => {
  const d = koreaNow();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const beforeDeadline = () => {
  const d = koreaNow();
  return d.getHours() < 9;
};

function showApp(show) {
  $("login").classList.toggle("hidden", show);
  $("app").classList.toggle("hidden", !show);
}

async function login() {
  $("loginError").textContent = "";
  const username = $("username").value.trim();
  const password = $("password").value;
  const account = LOGIN_USERS[username];

  if (!account) {
    $("loginError").textContent = "아이디 또는 비밀번호를 확인해 주세요.";
    return;
  }

  const {data, error} = await db.auth.signInWithPassword({
    email: account.email,
    password
  });

  if (error) {
    $("loginError").textContent = "로그인 실패: " + error.message;
    return;
  }

  currentUser = data.user;
  $("welcome").textContent = account.name;
  showApp(true);
  await loadGoals();
}

async function loadGoals() {
  $("goalError").textContent = "";
  $("today").textContent = dateKey();
  $("deadline").textContent = beforeDeadline()
    ? "목표 설정 가능 · 오전 9시 마감"
    : "목표 설정 마감 · 완료 체크 가능";

  $("goalTitle").disabled = !beforeDeadline();
  $("addBtn").disabled = !beforeDeadline();

  const {data, error} = await db
  .from("daily_goals")
  .select("id,title,completed,goal_date,user_id,created_at")
  .eq("goal_date", dateKey())
  .order("created_at", {ascending:true});

  if (error) {
    $("goalError").textContent = "목표를 불러오지 못했어요: " + error.message;
    return;
  }

  goals = data || [];
  renderGoals();
}

function renderGoals() {
  const done = goals.filter(g => g.completed).length;
  const total = goals.length;
  const rate = total ? Math.round(done / total * 100) : 0;

  $("progress").textContent = total
    ? `${done} / ${total}개 완료 · 달성률 ${rate}%`
    : "목표가 없어요. 오전 9시 전에 목표를 추가해 주세요.";
  $("bar").style.width = rate + "%";

  $("penalty").className = "";
  $("penalty").textContent = total === 0
    ? "목표가 없으면 달성률을 계산할 수 없어요."
    : rate < 80
      ? "벌칙 대상: 오늘 달성률이 80% 미만이에요. 친구에게 밥 사기!"
      : "벌칙 없음: 달성률이 80% 이상이에요.";
  $("penalty").classList.add(total && rate < 80 ? "error" : "good");

  const list = $("goals");
  list.replaceChildren();

  goals.forEach(goal => {
    const item = document.createElement("div");
    item.className = "goal";
    const check = document.createElement("input");
    check.type = "checkbox";
    check.checked = goal.completed;
    check.setAttribute("aria-label", goal.title);
    check.addEventListener("change", () => updateGoal(goal, check.checked));

    const title = document.createElement("span");
    title.textContent = goal.title;
    if (goal.completed) title.style.textDecoration = "line-through";

        item.append(check, title);
    list.append(item);
  });

  renderFriendGoals();
}

async function addGoal(event) {
  event.preventDefault();
  $("goalError").textContent = "";

  if (!beforeDeadline()) {
    $("goalError").textContent = "오전 9시가 지나 목표를 추가할 수 없어요.";
    return;
  }

  const title = $("goalTitle").value.trim();
  if (!title) return;

  const {error} = await db.from("daily_goals").insert({
    user_id: currentUser.id,
    goal_date: dateKey(),
    title
  });

  if (error) {
    $("goalError").textContent = error.message;
    return;
  }

  $("goalTitle").value = "";
  await loadGoals();
}

async function updateGoal(goal, completed) {
  const {error} = await db.from("daily_goals")
    .update({completed})
    .eq("id", goal.id)
    .eq("user_id", currentUser.id);

  if (error) {
    alert("완료 상태 저장에 실패했어요: " + error.message);
  }
  await loadGoals();
}

$("loginBtn").addEventListener("click", login);
$("password").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});
$("goalForm").addEventListener("submit", addGoal);

$("logoutBtn").addEventListener("click", async () => {
  await db.auth.signOut();
  currentUser = null;
  goals = [];
  showApp(false);
});

(async function init() {
  const {data} = await db.auth.getSession();
  if (data.session) {
    currentUser = data.session.user;
    const account = Object.values(LOGIN_USERS).find(
      a => a.email === currentUser.email
    );
    $("welcome").textContent = account ? account.name : "사용자";
    showApp(true);
    await loadGoals();
  }
})();
</script>
</body>
</html>
